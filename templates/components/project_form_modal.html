<div id="add-project-modal" popover class="modal-popover">
    <div class="modal-box">
        <div class="modal-header">
            <h2 class="form-title" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">Tambah Proyek Baru</h2>
            <button type="button" class="modal-close" popovertarget="add-project-modal" popovertargetaction="hide" aria-label="Tutup">&times;</button>
        </div>
        <form id="project-form">
            {% csrf_token %}
            <div class="modal-field">
                <label for="project-title">Title</label>
                <input type="text" id="project-title" name="title" required maxlength="255" placeholder="Contoh: Aplikasi Jadwal">
            </div>
            <div class="modal-field">
                <label for="project-tech-stack">Tech Stack</label>
                <input type="text" id="project-tech-stack" name="tech_stack" required maxlength="255" placeholder="Contoh: Django, DRF, JavaScript">
            </div>
            <div class="modal-field">
                <label for="project-description">Description</label>
                <textarea id="project-description" name="description" rows="4" required placeholder="Deskripsikan proyekmu..."></textarea>
            </div>
            <div class="modal-field">
                <label for="project-url">Project URL (Opsional)</label>
                <input type="url" id="project-url" name="project_url" placeholder="https://example.com/">
            </div>
            <div class="modal-field">
                <label for="project-image-url">Project Image URL (Opsional)</label>
                <input type="url" id="project-image-url" name="project_image_url" placeholder="https://example.com/image.png">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-reset-search" popovertarget="add-project-modal" popovertargetaction="hide">Batal</button>
                <button type="submit" class="btn-submit" style="margin-top: 0;">Tambah Proyek</button>
            </div>
        </form>
    </div>
</div>
