<tr id="contact-{{ contact.id }}" class="bg-amber-50/50 border-b border-amber-200">
  <td class="px-6 py-3">
    <input type="text"
           name="name"
           value="{{ contact.name }}"
           required
           form="edit-form-{{ contact.id }}"
           class="w-full px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
  </td>
  <td class="px-6 py-3">
    <input type="email"
           name="email"
           value="{{ contact.email }}"
           required
           form="edit-form-{{ contact.id }}"
           class="w-full px-3 py-1.5 text-sm bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
  </td>
  <td class="px-6 py-3 text-right space-x-2 whitespace-nowrap">
    <form id="edit-form-{{ contact.id }}"
          hx-put="{% url 'contacts:contact_update' contact.id %}"
          hx-target="#contact-{{ contact.id }}"
          hx-swap="outerHTML"
          class="inline">
      <button type="submit"
              class="inline-flex items-center px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow-sm transition">
        Simpan
      </button>
    </form>
    <button hx-get="{% url 'contacts:contact_row' contact.id %}"
            hx-target="#contact-{{ contact.id }}"
            hx-swap="outerHTML"
            class="inline-flex items-center px-3 py-1.5 bg-slate-500 hover:bg-slate-600 text-white text-xs font-semibold rounded-lg shadow-sm transition">
      Batal
    </button>
  </td>
</tr>
